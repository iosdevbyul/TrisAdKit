services:
  reward-ledger:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      REWARD_API_TOKENS_JSON: ${REWARD_API_TOKENS_JSON:?Set development-only bearer token mapping}
      REWARD_DATABASE: /data/rewards.sqlite3
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - reward-ledger-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  reward-ledger-data:
